[project]
name = "history-social-teacher-assistant"
version = "1.4.0"
description = "MVP backend for a history and social studies teacher assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]>=2",
  "asyncpg",
  "pydantic>=2",
  "pydantic-settings",
  "pgvector",
  "python-multipart",
  "pymupdf>=1.26",
  "httpx>=0.27",
  "python-docx>=1.1",
  "aiogram>=3.31,<4",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "ruff",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "telegram_bot*"]
exclude = ["tests*", "scripts*", "docs*", "data*", "sql*"]
