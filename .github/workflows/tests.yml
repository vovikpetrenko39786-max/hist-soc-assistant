name: Hist-Soc regression checks

on:
  push:
    branches:
      - main
      - "stage-2/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hist-soc-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: postgresql+asyncpg://ci:ci_test@127.0.0.1:55432/hist_soc_ingestion_test
      INGESTION_TEST_DATABASE_URL: postgresql+asyncpg://ci:ci_test@127.0.0.1:55432/hist_soc_ingestion_test
      GENERATION_PROVIDER: template
      EMBEDDING_PROVIDER: hash
      OPENAI_API_KEY: ""
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: hist_soc_ingestion_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d hist_soc_ingestion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile Python
        run: python -m compileall -q app telegram_bot tests scripts
      - name: Static correctness checks
        run: >-
          python -m ruff check --select E9,F
          app/api/routes/outputs.py
          app/services/export_integrity.py
          app/services/natural_language_workflow.py
          app/services/output_service.py
          app/services/source_ingestion.py
          tests/test_export_integrity.py
          tests/test_output_unique_paths.py
          tests/test_source_ingestion_transaction.py
          tests/test_source_ingestion_temp_paths.py
          tests/test_stabilization_quality.py
      - name: Regression suite with atomic-ingestion PostgreSQL tests
        run: python -m pytest -q
